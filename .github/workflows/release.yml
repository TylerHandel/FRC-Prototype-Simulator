# Every push to main: test, build the Windows app with MuJoCo's DLL and the packaged CAD reader,
# and publish it as a Velopack release on GitHub Releases. Installed copies find it within a
# minute, download it, and restart into it when nothing would be lost (PLAN.md D21; the same job
# as rebuilt-sim-native's .github/workflows/release.yml, without its DLSS and asset steps).
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
      - uses: Swatinem/rust-cache@v2
      - name: Version
        shell: bash
        run: echo "VERSION=0.1.${{ github.run_number }}" >> "$GITHUB_ENV"
      - name: MuJoCo
        shell: pwsh
        run: tools/fetch-mujoco.ps1
      - name: Test
        run: cargo test --workspace --exclude app --release
      - name: Build
        shell: bash
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"$VERSION\"/" Cargo.toml
          cargo build --release -p app
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: The CAD reader (OpenCascade, packaged so nobody needs Python)
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install cadquery-ocp pyinstaller
          pyinstaller --noconfirm --onedir --name cadread --collect-all OCP --collect-all vtkmodules --collect-all cadquery_ocp tools/cadread/cadread.py
      - name: Stage
        shell: bash
        run: |
          # pyinstaller wrote dist/cadread/ (the CAD reader and its libraries); add the app and MuJoCo
          cp target/release/frc-prototype-sim.exe dist/
          cp third_party/mujoco/bin/mujoco.dll dist/
          ls dist dist/cadread | head -20
      - name: Licences
        shell: bash
        run: |
          mkdir -p dist/licenses
          cp LICENSE dist/licenses/ 2>/dev/null || true
          echo "MuJoCo (Apache 2.0): https://github.com/google-deepmind/mujoco" > dist/licenses/THIRD-PARTY.txt
          echo "OpenCascade (LGPL 2.1 with exception), via cadquery-ocp: https://github.com/CadQuery/ocp" >> dist/licenses/THIRD-PARTY.txt
          echo "Bevy, egui, Velopack: MIT/Apache 2.0" >> dist/licenses/THIRD-PARTY.txt
      - name: Package and publish (Velopack)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: https://github.com/${{ github.repository }}
        run: |
          dotnet tool install -g vpk --version 1.2.161
          export PATH="$PATH:$USERPROFILE/.dotnet/tools"
          vpk download github --repoUrl "$REPO" --token "$GH_TOKEN" || true
          vpk pack --packId FrcPrototypeSim --packVersion "$VERSION" --packDir dist --mainExe frc-prototype-sim.exe --packTitle "FRC Prototype Simulator"
          vpk upload github --repoUrl "$REPO" --token "$GH_TOKEN" --publish --releaseName "FRC Prototype Simulator $VERSION" --tag "v$VERSION"
