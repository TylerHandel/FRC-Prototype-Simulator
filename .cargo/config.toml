# MuJoCo's shared library, fetched into third_party/mujoco by tools/fetch-mujoco.sh (Linux, macOS)
# or tools/fetch-mujoco.ps1 (Windows). mujoco-rs's build script links against it; tests and
# `cargo run` find it at run time through the library path set here.
[env]
MUJOCO_DYNAMIC_LINK_DIR = { value = "third_party/mujoco/lib", relative = true }
LD_LIBRARY_PATH = { value = "third_party/mujoco/lib", relative = true }
DYLD_LIBRARY_PATH = { value = "third_party/mujoco/lib", relative = true }
